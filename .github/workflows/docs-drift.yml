name: Documentation quality
permissions:
  contents: read

on:
  pull_request:
    branches: ["**"]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - ".github/copilot-instructions.md"
      - ".github/copilot-instructions/**"
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".prettier-markdown.json"
      - ".prettierignore"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-doc-drift.sh"
      - "scripts/check-markdown-format.mjs"
      - ".github/workflows/docs-drift.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: 🛫 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: ⚙️ Install root dependencies
        run: npm ci

      - name: 📝 Lint Markdown
        run: npm run lint:md

      - name: 💄 Check Markdown formatting
        run: npm run format:md:check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: 🔍 Audit AI-agent docs for drift
        run: bash scripts/audit-doc-drift.sh
