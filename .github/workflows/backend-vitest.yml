name: Backend Vitest Unit Tests
permissions:
  contents: read

on:
  pull_request:
    branches: "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-vitest.yml"
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  payroll-database-integration:
    if: github.event.action != 'labeled' || github.event.label.name == 'run'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYROLL_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:payroll:database

  api-unit-test:
    if: github.event.action != 'labeled' || github.event.label.name == 'run'
    runs-on: ubuntu-latest

    steps:
      - name: 🛫 Checkout
        uses: actions/checkout@v6

      - name: 🏗 Set up NodeJS 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: ⚙️ NPM install
        run: npm ci
        working-directory: ./backend

      - name: 🏗 Prisma Generate
        run: |
          npm run prisma:generate
        working-directory: ./backend

      - name: 💻 Run Vitest
        run: npm run test:unit:coverage
        working-directory: ./backend
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHAIN_ID: ${{ secrets.CHAIN_ID }}

      - name: ✅ Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api-unit-tests
