name: Frontend E2E Playwright

permissions:
  contents: read

on:
  pull_request:
    branches: "**"
    paths:
      - "app/**"
      - "backend/**"
      - "contract/**"
      - "docs/features/**"
      - "docs/testing/**"
      - ".github/workflows/app-e2e.yml"
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  full-stack-e2e:
    name: Full-stack E2E
    if: github.event.action != 'labeled' || github.event.label.name == 'run'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.48.2-noble
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cnc_e2e
        options: >-
          --health-cmd "pg_isready -U postgres -d cnc_e2e" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cnc_e2e
      NODE_ENV: test
      SECRET_KEY: full-stack-e2e-only
      FRONTEND_URL: http://localhost:5173
      PORT: "3000"
      CHAIN_ID: "31337"
      RPC_URL: http://127.0.0.1:8545

    steps:
      - name: 🛫 Checkout
        uses: actions/checkout@v6

      - name: 🏗 Set up Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: |
            app/package-lock.json
            backend/package-lock.json
            contract/package-lock.json

      - name: 📦 Install application dependencies
        run: npm ci
        working-directory: ./app

      - name: 📦 Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: 📦 Install contract dependencies
        run: npm ci
        working-directory: ./contract

      - name: 🔨 Compile contracts
        run: npm run compile
        working-directory: ./contract

      - name: ⛓ Start the local Hardhat node
        run: npm run node -- --hostname 0.0.0.0 > ../hardhat-e2e.log 2>&1 &
        working-directory: ./contract

      - name: ⏳ Wait for the local chain
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              --header "content-type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The local chain did not become ready"
          exit 1

      - name: 🖥 Start the browser-acceptance frontend
        run: npm run dev:e2e -- --host 0.0.0.0 --port 5174 > ../browser-frontend-e2e.log 2>&1 &
        working-directory: ./app
        env:
          VITE_APP_BACKEND_URL: http://127.0.0.1:3000
          VITE_E2E_RPC_URL: http://127.0.0.1:8545
          VITE_E2E_USDC_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
          VITE_E2E_USDCE_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"

      - name: ⏳ Wait for the browser-acceptance frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The browser-acceptance frontend did not become ready"
          exit 1

      - name: 🧪 Run browser acceptance coverage
        run: npm run test:browser:acceptance:coverage
        working-directory: ./app
        env:
          BASE_URL: http://127.0.0.1:5174
          HEADLESS: "true"

      - name: 📊 Generate browser coverage report
        if: always()
        run: npm run coverage:e2e:report
        working-directory: ./app

      - name: ✅ Upload browser coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./app/coverage/e2e/lcov.info
          flags: app-browser-acceptance

      - name: 📊 Upload browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-playwright-report
          path: app/playwright-report/
          retention-days: 30

      - name: ♻️ Reset the local chain for integrated journeys
        run: |
          curl --fail --silent \
            --header "content-type: application/json" \
            --data '{"jsonrpc":"2.0","method":"hardhat_reset","params":[],"id":1}' \
            http://127.0.0.1:8545 > /dev/null

      - name: 🗄 Generate Prisma client and migrate the disposable database
        run: |
          npm run prisma:generate
          npm run prisma:migrate
        working-directory: ./backend

      - name: 🚀 Deploy integrated E2E infrastructure
        run: |
          cp scripts/recipients.json.example scripts/recipients.json
          npx hardhat ignition deploy ignition/modules/IntegratedE2EInfrastructureModule.ts --network localhost --deployment-id ci-e2e
        working-directory: ./contract

      - name: 📋 Publish local deployment addresses to the frontend build
        run: cp contract/ignition/deployments/ci-e2e/deployed_addresses.json app/src/artifacts/deployed_addresses/chain-31337.json

      - name: 🔌 Start the backend
        run: npm start > ../backend-e2e.log 2>&1 &
        working-directory: ./backend

      - name: ⏳ Wait for the backend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The backend did not become ready"
          exit 1

      - name: 🖥 Start the E2E frontend
        run: npm run dev:e2e -- --host 0.0.0.0 --port 5173 > ../frontend-e2e.log 2>&1 &
        working-directory: ./app
        env:
          VITE_APP_BACKEND_URL: http://127.0.0.1:3000
          VITE_E2E_RPC_URL: http://127.0.0.1:8545
          VITE_E2E_SAFE_INFRA_SOURCE: manifest

      - name: ⏳ Wait for the frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The frontend did not become ready"
          exit 1

      - name: 🧪 Run integrated user journeys
        run: npm run test:e2e:integrated
        working-directory: ./app
        env:
          HEADLESS: "true"

      - name: 📊 Upload integrated Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-playwright-report
          path: app/playwright-report/
          retention-days: 30

      - name: 📈 Upload failure traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            app/test-results/
            hardhat-e2e.log
            browser-frontend-e2e.log
            backend-e2e.log
            frontend-e2e.log
          retention-days: 7
