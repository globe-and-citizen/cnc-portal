name: Release via GitHub PR

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release-from-pr:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    # Serialise reruns for the same merged PR so the later run sees its tag.
    concurrency:
      group: release-${{ github.event.pull_request.merge_commit_sha || github.sha }}
      cancel-in-progress: false

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Extract version information
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Version depuis le nom de la branche PR
          VERSION="${RELEASE_BRANCH#release/}"
          PR_NUMBER="$SOURCE_PR_NUMBER"
          echo "Source: PR #$PR_NUMBER"

          # Reject unexpected values before they can become a tag, step output, or file name.
          semver_pattern='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver_pattern || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid release version or PR number"
            exit 1
          fi

          VERSION="v${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "✅ Extracted version: $VERSION"

      - name: Validate version format
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver_pattern ]]; then
            echo "❌ Invalid release version"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Tag $VERSION already exists"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tag $VERSION is new"
          fi

      - name: Create annotated tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ steps.version.outputs.pr_number }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Message de tag avec référence à la PR
          TAG_MESSAGE="Release $VERSION (from PR #$PR_NUMBER)"

          git tag -a "$VERSION" -m "$TAG_MESSAGE"
          git push origin "refs/tags/$VERSION"
          echo "✅ Created and pushed tag: $VERSION"

      - name: Generate comprehensive changelog
        if: steps.check_tag.outputs.tag_exists == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Trouver le tag précédent
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "📝 Generating changelog from beginning"
            COMMITS=$(git log --pretty=format:"* %s (%h)" --no-merges | head -50)
          else
            echo "📝 Generating changelog from $PREV_TAG to $VERSION"
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          fi

          # Compter les commits
          COMMIT_COUNT=$(echo "$COMMITS" | wc -l)

          # Créer les notes de release
          cat > RELEASE_NOTES.md << EOF
          # 🚀 Release $VERSION

          > Released from GitHub PR merge workflow

          ## 📊 Summary
          - **$COMMIT_COUNT commits** since last release
          - **Branch:** \`release/$VERSION\` → \`main\`
          - **Release type:** ${VERSION##*-} 

          ## 📝 Changes
          $COMMITS

          ## 🔧 Installation

          ### Frontend (Vue.js)
          \`\`\`bash
          cd app
          npm install
          npm run build
          \`\`\`

          ### Backend (Express.js)
          \`\`\`bash
          cd backend
          npm install  
          npm run build
          \`\`\`

          ### Smart Contracts (Hardhat)
          \`\`\`bash
          cd contract
          npm install
          npm run compile
          \`\`\`

          ### Dashboard (Nuxt.js)
          \`\`\`bash
          cd dashboard
          npm install
          npm run build
          \`\`\`

          ## 🏗️ Development

          \`\`\`bash
          # Clone the repository
          git clone https://github.com/globe-and-citizen/cnc-portal.git
          cd cnc-portal

          # Install dependencies
          npm run install:all

          # Start development environment
          docker-compose -f docker-compose.dev.yml up
          \`\`\`

          ---

          **Full Changelog**: https://github.com/globe-and-citizen/cnc-portal/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD)}...$VERSION
          EOF

          echo "📄 Release notes generated"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "🚀 Release ${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: false # On utilise nos notes personnalisées
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload artifacts
        if: steps.check_tag.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "🏗️  Building artifacts for $VERSION"

          # Build App (Vue.js)
          echo "Building frontend..."
          cd app
          npm ci --prefer-offline
          npm run build
          cd ..
          tar -czf "cnc-portal-app-$VERSION.tar.gz" -C app/dist .

          # Build Backend (Express.js)  
          echo "Building backend..."
          cd backend
          npm ci --prefer-offline
          npm run build 2>/dev/null || echo "Backend build not available"
          cd ..
          if [ -d "backend/dist" ]; then
            tar -czf "cnc-portal-backend-$VERSION.tar.gz" -C backend dist package*.json
          fi

          # Build Contracts (Hardhat)
          echo "Building contracts..."
          cd contract
          npm ci --prefer-offline
          npm run compile
          cd ..
          tar -czf "cnc-portal-contracts-$VERSION.tar.gz" -C contract artifacts cache typechain-types

          # Build Dashboard (Nuxt.js)
          echo "Building dashboard..."
          cd dashboard  
          npm ci --prefer-offline
          npm run build 2>/dev/null || echo "Dashboard build not available"
          cd ..
          if [ -d "dashboard/.output" ]; then
            tar -czf "cnc-portal-dashboard-$VERSION.tar.gz" -C dashboard .output
          fi

          echo "✅ All artifacts built"

      - name: Upload artifacts to release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            cnc-portal-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        if: steps.check_tag.outputs.tag_exists == 'false' && !contains(steps.version.outputs.version, 'alpha') && !contains(steps.version.outputs.version, 'beta') && !contains(steps.version.outputs.version, 'rc')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success notification
        if: steps.check_tag.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ steps.version.outputs.pr_number }}
        run: |
          echo "🎉 Release $VERSION created successfully!"
          echo "📁 Artifacts built and uploaded"
          echo "🔗 Release URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          echo "📋 Source: PR #$PR_NUMBER"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Release process failed!"
          echo "Check the logs above for details"
          echo "📋 Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
