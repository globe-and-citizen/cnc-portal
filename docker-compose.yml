services:
  db:
    image: postgres:16-alpine
    # restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newpassword
      POSTGRES_DB: cnc-db
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

  frontend:
    build:
      context: ./app
      dockerfile: frontend.Dockerfile
      target: production
      args:
        - VITE_APP_BACKEND_URL
        - VITE_APP_NETWORK_ALIAS
        - VITE_APP_BLOCK_EXPLORER_URL
        - VITE_APP_CHAIN_ID
        - VITE_APP_CURRENCY_SYMBOL
        - VITE_APP_NETWORK_NAME
        - VITE_APP_POLYGON_RPC_URL
        - VITE_APP_RPC_URL
        - VITE_APP_SAFE_API_KEY
        - VITE_APP_SENTRY_DSN
        - VITE_APP_SENTRY_ENVIRONMENT
        - VITE_APP_WIDGET_URL
        - VITE_APP_RELEASE
    env_file:
      - ./app/.env.production
    ports:
      - "80:80" # Adjust port as needed
    volumes:
      - ./app:/app
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
      target: production
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000" # Adjust port as needed
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
  coverage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./backend/coverage:/var/www/html/backend
      - ./app/coverage:/var/www/html/app
      - ./contract/coverage:/var/www/html/contract

volumes:
  db:
