coverage:
  status:
    project:
      default:
        # Scope the project status to unit-test flags only. The
        # app-e2e-tests flag exercises end-to-end flows through the dev
        # server which loads every file on the route the user navigates
        # (router, lazy views, stores, …) — many of these aren't covered
        # by unit tests, so adding e2e to project status would surface
        # them as a coverage drop even though no test was removed.
        flags:
          - app-unit-tests
          - api-unit-tests
          - contract-unit-tests
        threshold: 0.5%
    patch:
      default:
        # Scoped to the unit-test flags for the same reason as `project` above:
        # the app-e2e-tests flag only exercises the happy-path login flow, so
        # including it computes patch coverage over lines no e2e test could ever
        # reach. Unscoped, a PR whose diff sits outside that one flow fails the
        # check on the e2e number alone — e.g. #2393 measured 33% combined while
        # the app-unit-tests flag reported 75% on the same diff.
        #
        # `patch` is a required check on develop, so this is a merge blocker
        # rather than the "informational" signal the previous comment here
        # claimed. Keep the 50% floor; just measure it against the suites that
        # are actually meant to cover new lines.
        flags:
          - app-unit-tests
          - api-unit-tests
          - contract-unit-tests
        target: 50%
        threshold: 10%

github_checks:
  annotations: true

flags:
  app-unit-tests:
    carryforward: true
    paths:
      - app
  api-unit-tests:
    carryforward: true
    paths:
      - backend
  contract-unit-tests:
    carryforward: true
    paths:
      - contract
  app-e2e-tests:
    carryforward: true
    paths:
      - app
ignore:
  - "app/*.ts"
  - "app/src/main.ts"
  - "app/src/e2e"  # mock connector is test infra, not product code
  - "app/src/e2e/**"
