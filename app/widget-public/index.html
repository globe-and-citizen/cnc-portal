<!doctype html>
<!--
  Static landing page for the widget's hosting domain — `publicDir` in
  `vite.widget.config.ts` copies this into `dist-widget/` on `build:widget`
  only (not during `dev:widget`, which serves `widget-dev/index.html`
  instead). Exists so visiting the bare domain shows the widget itself in
  action instead of the static file server's raw directory listing.

  Loads the real built `widget.js` sitting right next to this file (not the
  dev-mode ES module `widget-dev/index.html` uses) via a plain, non-async
  script tag — non-async so `window.CncPay` is guaranteed to exist by the
  time the next script tag runs, same reasoning `widget-dev/index.html`
  gets for free from ES modules being deferred by default.

  Demo values only (fake bank address) — and the Pay button is intercepted
  below before it ever reaches the widget's real payment flow. Without that,
  clicking it on the production build would prompt a real visitor's real
  wallet (`injected()` connector) to sign a real on-chain `approve()` against
  the zero-address bank, spending real gas on a transaction guaranteed to
  fail — confirmed by actually clicking it and watching that happen. The
  click is caught in the capture phase on `document`, before it reaches the
  button inside the widget's shadow root, so `payWithWidget` (`payment.ts`)
  never runs — this is a demo constraint local to this one static page, not
  a change to the widget itself.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CNC Pay widget</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        box-sizing: border-box;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      header {
        text-align: center;
        max-width: 28rem;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: #10b98122;
        color: #059669;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #64748b;
        line-height: 1.6;
        margin: 0;
        font-size: 0.9rem;
      }
      #cnc-pay {
        width: 100%;
        max-width: 28rem;
      }
      #demo-note {
        max-width: 28rem;
        text-align: center;
        font-size: 0.8rem;
        color: #94a3b8;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="badge">CNC Pay</span>
      <h1>Payment Gate widget host</h1>
      <p>
        This domain serves <code>widget.js</code>, the embeddable script for CNC Pay's Payment
        Gate — below is a live preview, not a real checkout.
      </p>
    </header>
    <div id="cnc-pay"></div>
    <p id="demo-note"></p>
    <script
      src="/widget.js"
      data-bank="0x0000000000000000000000000000000000000000"
      data-token="USDC"
    ></script>
    <script>
      // Capture phase, on `document`, fires before the click ever reaches
      // the Pay button inside `#cnc-pay`'s shadow root — this stops it
      // before Vue's own click handler (and payWithWidget behind it) runs.
      // `composedPath()` (unlike `event.target`) sees inside the shadow
      // root, which is what lets this find the real button element.
      document.addEventListener(
        'click',
        (event) => {
          const isPayButton = event
            .composedPath()
            .some((el) => el instanceof HTMLButtonElement && el.textContent?.trim().startsWith('Pay '))
          if (!isPayButton) return
          event.preventDefault()
          event.stopPropagation()
          document.getElementById('demo-note').textContent =
            'This is a preview — no wallet connection or real payment is triggered.'
        },
        true
      )

      CncPay.setFactureId('demo_preview')
      CncPay.setAmount('10.00')
      CncPay.show('#cnc-pay')
    </script>
  </body>
</html>
